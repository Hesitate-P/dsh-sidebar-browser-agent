    <text x="426" y="351" font-family="-apple-system,'SF Pro Text',sans-serif" font-size="12.5" font-weight="700" fill="#3D5AFE">sidebar_browser</text>
    <rect x="526" y="337" width="42" height="20" rx="6" fill="#F2F4F8"/>
    <text x="536" y="351" font-family="-apple-system,'SF Pro Text',sans-serif" font-size="11" fill="#4B5563">open</text>
    <text x="388" y="382" font-family="'SF Mono',Menlo,monospace" font-size="11.5" fill="#6B7280">url: "https://example.com"</text>
    <text x="388" y="401" font-family="-apple-system,'PingFang SC',sans-serif" font-size="11.5" fill="#3B4252">已打开新标签 tab-1，等待加载完成。</text>

