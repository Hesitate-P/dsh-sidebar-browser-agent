    <text x="426" y="463" font-family="-apple-system,'SF Pro Text',sans-serif" font-size="12.5" font-weight="700" fill="#12A66A">sidebar_page</text>
    <rect x="524" y="449" width="58" height="20" rx="6" fill="#F2F4F8"/>
    <text x="534" y="463" font-family="-apple-system,'SF Pro Text',sans-serif" font-size="11" fill="#4B5563">snapshot</text>
    <g font-family="'SF Mono',Menlo,monospace" font-size="11.5" fill="#475569">
      <text x="388" y="496">viewport=1440x900 scroll=0/1240 dpr=2</text>
      <text x="388" y="516">- [e1] heading "Example Domain"</text>
      <text x="388" y="536">- [e2] paragraph "This domain is for use..."</text>
      <text x="388" y="556">- [e3] link "More information" href="https://iana.org"</text>
    </g>

