    <g stroke="#6B7280" stroke-width="1.4" stroke-linecap="round">
      <path d="M251 310l3 3 3-3"/><circle cx="254" cy="313" r="4"/>
      <path d="M300 310v6M297 313h6" stroke-width="1.6"/>
