    <text x="618" y="264" font-family="-apple-system,'PingFang SC',sans-serif" font-size="14" fill="#1F2329">并告诉我页面标题。</text>

    <!-- tool card 1 -->
    <rect x="372" y="318" width="560" height="96" rx="14" fill="#FFFFFF" stroke="#E7EAF0" filter="url(#card)"/>
    <rect x="388" y="334" width="26" height="26" rx="8" fill="#E8F0FF"/>
