    <rect x="1400" y="690" width="112" height="86" rx="12" fill="#FFFFFF" stroke="#E3E6EC"/>
    <rect x="1412" y="704" width="88" height="10" rx="5" fill="#DCE4FF"/>
    <rect x="1412" y="722" width="60" height="8" rx="4" fill="#EEF1F7"/>
    <rect x="1412" y="738" width="76" height="8" rx="4" fill="#EEF1F7"/>
    <rect x="1412" y="754" width="44" height="8" rx="4" fill="#EEF1F7"/>

    <!-- footer status -->
    <rect x="1060" y="908" width="500" height="52" fill="#F1F3F7"/>
    <circle cx="1088" cy="934" r="4" fill="#22C55E"/>
    <text x="1100" y="938" font-family="-apple-system,'PingFang SC',sans-serif" font-size="11.5" fill="#6B7280">bridge connected · 插件 0.5.2 · 示意图（非真实会话）</text>
