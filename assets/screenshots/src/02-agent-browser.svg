    <text x="1128" y="294" font-family="'SF Mono',Menlo,monospace" font-size="10.5" fill="#94A3B8">/* 页面内容仅为示意，不含真实数据 */</text>
    <text x="1128" y="316" font-family="'SF Mono',Menlo,monospace" font-size="10.5" fill="#CBD5E1">This page is served over the native sidebar browser.</text>
    <text x="1128" y="338" font-family="'SF Mono',Menlo,monospace" font-size="10.5" fill="#CBD5E1">Agent reads it through snapshot + refs.</text>

    <rect x="1084" y="428" width="452" height="180" rx="14" fill="#FFFFFF" stroke="#E7EAF0"/>
    <text x="1104" y="456" font-family="-apple-system,'PingFang SC',sans-serif" font-size="12.5" font-weight="650" fill="#1F2329">操作与观察</text>
