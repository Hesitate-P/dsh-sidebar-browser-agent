      <circle cx="1106" cy="482" r="3" fill="#5B7BFF"/><text x="1118" y="486">snapshot：语义树 + e12 ref</text>
      <circle cx="1106" cy="506" r="3" fill="#5B7BFF"/><text x="1118" y="510">click / type / press：原生输入</text>
      <circle cx="1106" cy="530" r="3" fill="#5B7BFF"/><text x="1118" y="534">observed：变更、焦点、对话框</text>
      <circle cx="1106" cy="554" r="3" fill="#5B7BFF"/><text x="1118" y="558">view：侧栏可见性 + viewport</text>
      <circle cx="1106" cy="578" r="3" fill="#5B7BFF"/><text x="1118" y="582">shadow / iframe / fullPage / 上传下载</text>
    </g>
