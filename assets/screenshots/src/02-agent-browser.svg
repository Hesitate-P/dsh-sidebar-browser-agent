    <rect x="340" y="40" width="720" height="920" fill="#FFFFFF"/>
    <text x="372" y="88" font-family="-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="650" fill="#1F2329">侧栏浏览器 Agent 演示</text>
    <rect x="372" y="104" width="58" height="24" rx="12" fill="#F2F4F8"/>
    <text x="386" y="120" font-family="-apple-system,'PingFang SC',sans-serif" font-size="11.5" fill="#6B7280">智能体</text>
    <rect x="440" y="104" width="66" height="24" rx="12" fill="#F2F4F8"/>
    <text x="455" y="120" font-family="-apple-system,'PingFang SC',sans-serif" font-size="11.5" fill="#6B7280">创建模式</text>
