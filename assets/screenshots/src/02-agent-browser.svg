<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F5F6FA"/><stop offset="1" stop-color="#E9ECF5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5B7BFF"/><stop offset="1" stop-color="#3D5AFE"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8F6FF"/><stop offset="1" stop-color="#ECE6FF"/>
    </linearGradient>
    <filter id="win" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1B2559" flood-opacity="0.14"/>
    </filter>
    <filter id="card" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1B2559" flood-opacity="0.07"/>
    </filter>
    <clipPath id="windowClip"><rect x="40" y="40" width="1520" height="920" rx="20"/></clipPath>
    <clipPath id="pageClip"><rect x="1108" y="208" width="424" height="700" rx="10"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="40" y="40" width="1520" height="920" rx="20" fill="#FFFFFF" filter="url(#win)"/>
  <g clip-path="url(#windowClip)">
    <!-- sidebar -->
    <rect x="40" y="40" width="300" height="920" fill="#F3F4F7"/>
    <rect x="339" y="40" width="1" height="920" fill="#E5E7EB"/>
    <circle cx="76" cy="82" r="14" fill="url(#accent)"/>
    <path d="M69 82c4-8 10-8 14 0-4 2-6 2-7 6-3 0-5-2-7-6z" fill="#FFFFFF"/>
    <text x="100" y="88" font-family="-apple-system,'SF Pro Text','PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#1F2329">deepseek</text>
    <rect x="188" y="72" width="66" height="20" rx="5" fill="#1F2329"/>
    <text x="199" y="86.5" font-family="-apple-system,'SF Pro Text',sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">HARNESS</text>

    <rect x="60" y="118" width="260" height="44" rx="12" fill="#FFFFFF" stroke="#E3E6EC"/>
    <circle cx="82" cy="140" r="7" stroke="#5B6B8C" stroke-width="1.6"/>
    <path d="M87 145l5 5" stroke="#5B6B8C" stroke-width="1.6" stroke-linecap="round"/>
    <text x="100" y="146" font-family="-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#1F2329">新会话</text>

    <g font-family="-apple-system,'PingFang SC',sans-serif" font-size="14" fill="#3B4252">
      <rect x="60" y="178" width="260" height="34" rx="8" fill="#E8ECF9"/>
      <rect x="76" y="186" width="15" height="15" rx="3" stroke="#3D5AFE" stroke-width="1.5" fill="none"/>
      <text x="102" y="200" fill="#2B4BE0" font-weight="600">插件</text>
      <circle cx="84" cy="232" r="8" stroke="#5B6475" stroke-width="1.5" fill="none"/>
      <path d="M84 226v7l4 3" stroke="#5B6475" stroke-width="1.5" stroke-linecap="round"/>
      <text x="102" y="237">自动化任务</text>
