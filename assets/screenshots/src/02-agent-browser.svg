      <rect x="76" y="378" width="14" height="16" rx="3" fill="#E8F7EF" stroke="#8CCBA8"/>
      <text x="102" y="391">默认工作区</text>
      <rect x="60" y="410" width="260" height="36" rx="9" fill="#E9EDF9"/>
      <rect x="76" y="420" width="14" height="16" rx="3" fill="#DCE4FF" stroke="#7E97FF"/>
      <text x="102" y="433" fill="#2B4BE0" font-weight="600">侧栏浏览器 Agent</text>
    </g>
    <circle cx="76" cy="912" r="9" fill="#C7D2FE"/>
    <text x="94" y="917" font-family="-apple-system,'PingFang SC',sans-serif" font-size="12" fill="#6B7280">workspace · demo</text>

