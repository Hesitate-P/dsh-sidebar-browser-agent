    <rect x="1084" y="124" width="452" height="14" fill="#F3F5F9"/>
    <circle cx="1104" cy="119" r="4" fill="#FF6058"/><circle cx="1118" cy="119" r="4" fill="#FFBD2E"/><circle cx="1132" cy="119" r="4" fill="#28C840"/>
    <rect x="1170" y="110" width="330" height="18" rx="9" fill="#FFFFFF" stroke="#E3E6EC"/>
    <text x="1182" y="123" font-family="'SF Mono',Menlo,monospace" font-size="10.5" fill="#6B7280">https://example.com</text>
    <text x="1112" y="174" font-family="-apple-system,'SF Pro Text',sans-serif" font-size="22" font-weight="700" fill="#111827">Example Domain</text>
    <text x="1112" y="204" font-family="-apple-system,'SF Pro Text',sans-serif" font-size="12" fill="#4B5563">This domain is for use in illustrative examples.</text>
