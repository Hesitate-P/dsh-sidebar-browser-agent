    <rect x="374" y="168" width="28" height="3" rx="1.5" fill="#3D5AFE"/>
    <text x="430" y="158" font-family="-apple-system,'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A6">轨迹</text>
    <rect x="340" y="176" width="720" height="1" fill="#EEF0F4"/>

