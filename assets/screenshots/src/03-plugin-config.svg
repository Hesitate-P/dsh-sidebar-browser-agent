    <text x="566" y="208" font-family="'SF Mono',Menlo,monospace" font-size="11.5" fill="#7C87A0">dsh-sidebar-browser-agent · v0.5.2</text>
    <rect x="880" y="166" width="64" height="24" rx="12" fill="#DCFCE7"/>
    <text x="895" y="182" font-family="-apple-system,'PingFang SC',sans-serif" font-size="11.5" font-weight="600" fill="#15803D">已启用</text>
    <text x="488" y="250" font-family="-apple-system,'PingFang SC',sans-serif" font-size="12.5" fill="#6B7280">原生控制 DSH 右侧栏浏览器：语义快照与 ref、点击/输入、Shadow DOM 与同源 iframe、整页截图、前进后退、响应式视口、JS 对话框以及大文件上传/下载。</text>

    <!-- hero card -->
    <rect x="488" y="272" width="1040" height="150" rx="16" fill="url(#hero)" stroke="#E4DDFB"/>
    <text x="512" y="306" font-family="-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="650" fill="#3F3D8F">让 Agent 操作右侧栏里的真实网页</text>
    <text x="512" y="330" font-family="-apple-system,'PingFang SC',sans-serif" font-size="11.5" fill="#6B63A8">读取、点击、输入、滚动、执行 JavaScript、整页截图 —— 全部通过原生 Electron webview。</text>
    <rect x="512" y="350" width="208" height="42" rx="10" fill="#FFFFFF" stroke="#E3E6EC"/>
    <circle cx="534" cy="371" r="9" fill="#5B7BFF" opacity="0.18"/><circle cx="534" cy="371" r="4.5" fill="#3D5AFE"/>
    <text x="554" y="376" font-family="'SF Mono',Menlo,monospace" font-size="11.5" fill="#3B4252">sidebar_browser</text>
    <rect x="736" y="350" width="190" height="42" rx="10" fill="#FFFFFF" stroke="#E3E6EC"/>
    <circle cx="756" cy="371" r="9" fill="#12A66A" opacity="0.18"/><circle cx="756" cy="371" r="4.5" fill="#12A66A"/>
    <text x="776" y="376" font-family="'SF Mono',Menlo,monospace" font-size="11.5" fill="#3B4252">sidebar_page</text>
    <path d="M936 371h34" stroke="#7E97FF" stroke-width="2.2" stroke-linecap="round"/><path d="M962 364l8 7-8 7" stroke="#7E97FF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="985" y="338" width="210" height="66" rx="12" fill="#FFFFFF" stroke="#E3E6EC"/>
    <rect x="1000" y="352" width="70" height="9" rx="4.5" fill="#DCE4FF"/>
    <rect x="1000" y="368" width="160" height="7" rx="3.5" fill="#EEF1F7"/>
    <rect x="1000" y="381" width="128" height="7" rx="3.5" fill="#EEF1F7"/>
    <rect x="1212" y="352" width="58" height="22" rx="6" fill="#EDF1FF"/>
    <text x="1222" y="367" font-family="'SF Mono',Menlo,monospace" font-size="9.5" fill="#3D5AFE">snapshot</text>

    <!-- configuration switches -->
    <text x="488" y="468" font-family="-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="650" fill="#1F2329">配置</text>
    <text x="544" y="468" font-family="-apple-system,'PingFang SC',sans-serif" font-size="11.5" fill="#9AA3B2">修改后点击保存生效</text>
    <line x1="488" y1="486" x2="1528" y2="486" stroke="#EEF0F4"/>

    <!-- rows -->
    <g font-family="-apple-system,'PingFang SC',sans-serif">
      <!-- row 1 -->
      <text x="488" y="524" font-size="13.5" font-weight="600" fill="#1F2329">启用插件</text>
      <text x="488" y="544" font-size="11.5" fill="#8A93A6">注册 sidebar_browser 与 sidebar_page 工具</text>
      <rect x="1432" y="514" width="48" height="26" rx="13" fill="#3D5AFE"/><circle cx="1468" cy="527" r="10" fill="#FFFFFF"/>
      <line x1="488" y1="566" x2="1528" y2="566" stroke="#F1F3F7"/>
      <!-- row 2 -->
      <text x="488" y="604" font-size="13.5" font-weight="600" fill="#1F2329">允许 eval</text>
      <text x="488" y="624" font-size="11.5" fill="#8A93A6">允许页面内 JavaScript（仅建议用于页面侧计算）</text>
      <rect x="1432" y="594" width="48" height="26" rx="13" fill="#3D5AFE"/><circle cx="1468" cy="607" r="10" fill="#FFFFFF"/>
      <line x1="488" y1="646" x2="1528" y2="646" stroke="#F1F3F7"/>
      <!-- row 3 -->
      <text x="488" y="684" font-size="13.5" font-weight="600" fill="#1F2329">允许原生输入</text>
      <text x="488" y="704" font-size="11.5" fill="#8A93A6">原生点击、输入与按键事件</text>
      <rect x="1432" y="674" width="48" height="26" rx="13" fill="#3D5AFE"/><circle cx="1468" cy="687" r="10" fill="#FFFFFF"/>
      <line x1="488" y1="726" x2="1528" y2="726" stroke="#F1F3F7"/>
      <!-- row 4 -->
      <text x="488" y="764" font-size="13.5" font-weight="600" fill="#1F2329">允许本地文件上传</text>
      <text x="488" y="784" font-size="11.5" fill="#8A93A6">读取本地文件并附加到页面文件输入框或拖放区</text>
      <rect x="1432" y="754" width="48" height="26" rx="13" fill="#3D5AFE"/><circle cx="1468" cy="767" r="10" fill="#FFFFFF"/>
      <!-- hosts -->
      <text x="488" y="828" font-size="13.5" font-weight="600" fill="#1F2329">允许的主机</text>
      <text x="488" y="848" font-size="11.5" fill="#8A93A6">为空表示允许所有 HTTP(S) 主机；每行一个域名</text>
      <rect x="488" y="862" width="620" height="58" rx="10" fill="#F8F9FB" stroke="#E5E8EE"/>
      <text x="504" y="886" font-family="'SF Mono',Menlo,monospace" font-size="11.5" fill="#6B7280">example.com</text>
      <text x="504" y="905" font-family="'SF Mono',Menlo,monospace" font-size="11.5" fill="#A0A8B8">docs.example.org</text>
    </g>

    <!-- save footer -->
    <circle cx="1152" cy="884" r="4" fill="#22C55E"/>
    <text x="1164" y="888" font-family="-apple-system,'PingFang SC',sans-serif" font-size="11.5" fill="#6B7280">已同步配置</text>
    <rect x="1304" y="866" width="84" height="40" rx="10" fill="#FFFFFF" stroke="#E3E6EC"/>
    <text x="1327" y="891" font-family="-apple-system,'PingFang SC',sans-serif" font-size="12.5" fill="#4B5563">放弃</text>
    <rect x="1400" y="866" width="84" height="40" rx="10" fill="#3D5AFE"/>
    <text x="1423" y="891" font-family="-apple-system,'PingFang SC',sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF">保存</text>

    <text x="488" y="948" font-family="-apple-system,'PingFang SC',sans-serif" font-size="10.5" fill="#B6BECB">示意图（非真实界面截图）</text>
  </g>
</svg>
