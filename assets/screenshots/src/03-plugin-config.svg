<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F6FA"/><stop offset="1" stop-color="#E9ECF5"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5B7BFF"/><stop offset="1" stop-color="#3D5AFE"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F6FF"/><stop offset="1" stop-color="#ECE6FF"/></linearGradient>
    <filter id="win" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1B2559" flood-opacity="0.14"/></filter>
    <filter id="card" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1B2559" flood-opacity="0.07"/></filter>
    <clipPath id="windowClip"><rect x="40" y="40" width="1520" height="920" rx="20"/></clipPath>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="40" y="40" width="1520" height="920" rx="20" fill="#FFFFFF" filter="url(#win)"/>
  <g clip-path="url(#windowClip)">
    <!-- top bar -->
    <rect x="40" y="40" width="1520" height="72" fill="#FFFFFF"/>
    <rect x="40" y="112" width="1520" height="1" fill="#E9ECF1"/>
    <circle cx="84" cy="76" r="15" fill="url(#accent)"/>
    <path d="M77 76c4-8 10-8 14 0-4 2-6 2-7 6-3 0-5-2-7-6z" fill="#FFFFFF"/>
    <text x="108" y="82" font-family="-apple-system,'SF Pro Text',sans-serif" font-size="17" font-weight="700" fill="#1F2329">deepseek</text>
    <rect x="192" y="67" width="66" height="20" rx="5" fill="#1F2329"/>
    <text x="203" y="81.5" font-family="-apple-system,'SF Pro Text',sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">HARNESS</text>
    <text x="292" y="84" font-family="-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="650" fill="#1F2329">设置</text>
    <path d="M340 76l6 6-6 6" stroke="#9AA3B2" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="358" y="84" font-family="-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="650" fill="#1F2329">插件</text>
    <circle cx="1488" cy="76" r="9" fill="#E9ECF3"/>
    <circle cx="1514" cy="76" r="9" fill="#E9ECF3"/>

    <!-- left plugin list -->
    <rect x="40" y="113" width="400" height="847" fill="#F8F9FB"/>
    <rect x="439" y="113" width="1" height="847" fill="#E9ECF1"/>
    <text x="64" y="158" font-family="-apple-system,'PingFang SC',sans-serif" font-size="13" font-weight="650" fill="#6B7280">已安装插件</text>
    <rect x="64" y="174" width="352" height="36" rx="10" fill="#FFFFFF" stroke="#E5E8EE"/>
    <circle cx="84" cy="192" r="6" stroke="#9AA3B2" stroke-width="1.5" fill="none"/><path d="M88 196l4 4" stroke="#9AA3B2" stroke-width="1.5" stroke-linecap="round"/>
    <text x="102" y="197" font-family="-apple-system,'PingFang SC',sans-serif" font-size="12.5" fill="#A0A8B8">搜索插件</text>

    <rect x="56" y="228" width="368" height="72" rx="12" fill="#EDF1FF" stroke="#DCE4FF"/>
    <rect x="72" y="244" width="38" height="38" rx="10" fill="url(#accent)"/>
    <rect x="79" y="252" width="24" height="18" rx="3" fill="#FFFFFF" opacity="0.92"/>
    <rect x="79" y="252" width="24" height="5" rx="2.5" fill="#C7D2FE"/>
    <path d="M97 262l5 3-5 3v-6z" fill="#3D5AFE"/>
    <text x="122" y="260" font-family="-apple-system,'PingFang SC',sans-serif" font-size="13.5" font-weight="650" fill="#1F2329">侧栏浏览器 Agent</text>
    <text x="122" y="280" font-family="'SF Mono',Menlo,monospace" font-size="10.5" fill="#7C87A0">dsh-sidebar-browser-agent</text>
    <rect x="356" y="250" width="52" height="20" rx="10" fill="#DCFCE7"/>
    <text x="366" y="264" font-family="-apple-system,'PingFang SC',sans-serif" font-size="10.5" font-weight="600" fill="#15803D">已启用</text>

    <g font-family="-apple-system,'PingFang SC',sans-serif">
      <rect x="56" y="312" width="368" height="60" rx="12" fill="#FFFFFF"/>
      <rect x="72" y="326" width="32" height="32" rx="9" fill="#E8F7EF"/>
      <circle cx="88" cy="342" r="8" stroke="#12A66A" stroke-width="2" fill="none"/>
      <text x="118" y="340" font-size="13" font-weight="600" fill="#1F2329">终端工具</text>
      <text x="118" y="358" font-size="10.5" fill="#8A93A6">dsh-terminal-tools</text>
      <rect x="352" y="332" width="56" height="20" rx="10" fill="#F1F3F7"/>
      <text x="362" y="346" font-size="10.5" fill="#6B7280">已启用</text>

      <rect x="56" y="382" width="368" height="60" rx="12" fill="#FFFFFF"/>
      <rect x="72" y="396" width="32" height="32" rx="9" fill="#FFF4E6"/>
      <path d="M82 412h12M82 416h8" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <text x="118" y="410" font-size="13" font-weight="600" fill="#1F2329">会话记忆</text>
      <text x="118" y="428" font-size="10.5" fill="#8A93A6">dsh-session-memory</text>
      <rect x="352" y="402" width="56" height="20" rx="10" fill="#F1F3F7"/>
      <text x="362" y="416" font-size="10.5" fill="#6B7280">已启用</text>
    </g>

    <!-- right detail -->
    <rect x="440" y="113" width="1120" height="847" fill="#FFFFFF"/>
    <rect x="488" y="156" width="60" height="60" rx="16" fill="url(#accent)"/>
    <rect x="500" y="170" width="36" height="26" rx="4" fill="#FFFFFF" opacity="0.95"/>
    <rect x="500" y="170" width="36" height="7" rx="3.5" fill="#C7D2FE"/>
    <path d="M525 185l8 4-8 4v-8z" fill="#3D5AFE"/>
